<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voidlight Office</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%2338bdf8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">

</head>
<body>
  <div class="topbar">
    <span class="brand">VOIDLIGHT OFFICE</span>
    <button class="topbar-btn" onclick="openInsights()">Insights</button>
    <span class="stat" id="stat-working"></span>
    <span class="stat" id="stat-tokens"></span>
    <input id="search" class="search" type="search" placeholder="cari nama / judul / tool / objective" oninput="onSearch(this.value)">
    <span class="age" id="age"></span>
  </div>
  <div class="banner" id="banner"></div>
  <main>
    <div class="rooms" id="rooms"></div>
    <div class="feed" id="feed"><h3 id="feed-title">Activity</h3><div id="feed-rows"></div></div>
  </main>
  <div class="slideover" id="slideover"></div>
  <div class="overlay" id="insights-overlay"></div>
<script src="app.js"></script>
</body>
</html>

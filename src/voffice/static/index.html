<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voidlight Office</title>
<link rel="stylesheet" href="styles.css">

</head>
<body>
  <div class="topbar">
    <span class="brand">VOIDLIGHT OFFICE</span>
    <button class="topbar-btn" onclick="openInsights()">Insights</button>
    <span class="stat" id="stat-working"></span>
    <span class="stat" id="stat-tokens"></span>
    <span class="age" id="age"></span>
  </div>
  <div class="banner" id="banner"></div>
  <main>
    <div class="rooms" id="rooms"></div>
    <div class="feed" id="feed"><h3 id="feed-title">Activity</h3><div id="feed-rows"></div></div>
  </main>
  <div class="slideover" id="slideover"></div>
  <div class="overlay" id="insights-overlay"></div>
<script src="app.js"></script>
</body>
</html>

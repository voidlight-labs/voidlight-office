<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voidlight Office</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%230a0c0f'/%3E%3Cpath d='M16 5l2.8 8.2L27 16l-8.2 2.8L16 27l-2.8-8.2L5 16l8.2-2.8z' fill='%234fd0f7'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">

</head>
<body>
  <header class="statusline">
    <span class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 1.5l2.7 7.8 7.8 2.7-7.8 2.7L12 22.5l-2.7-7.8-7.8-2.7 7.8-2.7z" fill="#4fd0f7"/>
      </svg>
      VOIDLIGHT OFFICE<span class="cursor">▊</span>
    </span>
    <button class="btn" onclick="openInsights()">Insights</button>
    <span class="seg" id="stat-working"></span>
    <span class="seg" id="stat-tokens"></span>
    <span class="seg dim" id="stat-models"></span>
    <label class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5" stroke-linecap="round"/>
      </svg>
      <input id="search" class="search" type="search" placeholder="cari nama / judul / tool / objective" oninput="onSearch(this.value)">
      <kbd>/</kbd>
    </label>
    <span class="age" id="age"></span>
  </header>
  <div class="banner" id="banner"></div>
  <main>
    <section class="board" id="rooms"></section>
    <aside class="log" id="feed">
      <div class="log-head"><h3 id="feed-title">Event Log</h3><span class="feed-count" id="feed-count"></span></div>
      <div class="log-body" id="feed-rows"></div>
    </aside>
  </main>
  <div class="slideover" id="slideover"></div>
  <div class="overlay" id="insights-overlay"></div>
<script src="app.js"></script>
</body>
</html>

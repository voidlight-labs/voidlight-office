<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voidlight Office</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2338bdf8'/%3E%3Cstop offset='1' stop-color='%23818cf8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='%2305080f'/%3E%3Cpath d='M16 5l2.8 8.2L27 16l-8.2 2.8L16 27l-2.8-8.2L5 16l8.2-2.8z' fill='url(%23g)'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">

</head>
<body>
  <div class="topbar">
    <span class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
        <defs>
          <linearGradient id="bm-g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#818cf8"/>
          </linearGradient>
        </defs>
        <path d="M12 1.5l2.7 7.8 7.8 2.7-7.8 2.7L12 22.5l-2.7-7.8-7.8-2.7 7.8-2.7z" fill="url(#bm-g)"/>
      </svg>
      VOIDLIGHT <b>OFFICE</b>
    </span>
    <button class="topbar-btn" onclick="openInsights()">Insights</button>
    <span class="stat-pill" id="stat-working"></span>
    <span class="stat-pill" id="stat-tokens"></span>
    <span class="stat-models" id="stat-models"></span>
    <label class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5" stroke-linecap="round"/>
      </svg>
      <input id="search" class="search" type="search" placeholder="cari nama / judul / tool / objective" oninput="onSearch(this.value)">
      <kbd>/</kbd>
    </label>
    <span class="age" id="age"></span>
  </div>
  <div class="banner" id="banner"></div>
  <main>
    <div class="rooms" id="rooms"></div>
    <div class="feed" id="feed">
      <div class="feed-head"><h3 id="feed-title">Activity</h3><span class="feed-count" id="feed-count"></span></div>
      <div class="feed-body" id="feed-rows"></div>
    </div>
  </main>
  <div class="slideover" id="slideover"></div>
  <div class="overlay" id="insights-overlay"></div>
<script src="app.js"></script>
</body>
</html>
